<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vantage</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 280px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 13px;
      color: #111827;
      background: #fff;
    }
    .header {
      background: #4f46e5;
      padding: 16px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .header-icon {
      width: 32px; height: 32px;
      background: rgba(255,255,255,0.2);
      border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      font-size: 16px;
    }
    .header h1 { color: #fff; font-size: 15px; font-weight: 700; }
    .header p { color: rgba(255,255,255,0.7); font-size: 11px; }
    .body { padding: 16px; }
    .field { margin-bottom: 14px; }
    label {
      display: block;
      font-size: 11px; font-weight: 600;
      color: #6b7280;
      text-transform: uppercase;
      letter-spacing: 0.4px;
      margin-bottom: 5px;
    }
    input {
      width: 100%;
      border: 1px solid #e5e7eb;
      border-radius: 8px;
      padding: 8px 10px;
      font-size: 12px;
      color: #374151;
      outline: none;
      transition: border-color 0.15s;
    }
    input:focus { border-color: #4f46e5; }
    button {
      width: 100%;
      background: #4f46e5;
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 10px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
    }
    button:hover { background: #4338ca; }
    .status {
      margin-top: 10px;
      font-size: 11px;
      text-align: center;
      min-height: 16px;
    }
    .status.success { color: #16a34a; }
    .status.error { color: #dc2626; }
    .footer {
      padding: 12px 16px;
      border-top: 1px solid #f3f4f6;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .indicator {
      display: flex; align-items: center; gap: 6px;
      font-size: 11px; color: #6b7280;
    }
    .dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: #d1d5db;
    }
    .dot.connected { background: #22c55e; }
    a { font-size: 11px; color: #4f46e5; text-decoration: none; }
    a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="header">
    <div class="header-icon">⚡</div>
    <div>
      <h1>Vantage</h1>
      <p>Sales Intelligence</p>
    </div>
  </div>

  <div class="body">
    <div class="field">
      <label>API Key</label>
      <input type="password" id="apiKey" placeholder="vnt_live_..." />
    </div>
    <div class="field">
      <label>API URL</label>
      <input type="text" id="apiUrl" placeholder="https://api.vantage.invigilo.ai" />
    </div>
    <button id="saveBtn">Save Settings</button>
    <div class="status" id="status"></div>
  </div>

  <div class="footer">
    <div class="indicator">
      <div class="dot" id="connectionDot"></div>
      <span id="connectionLabel">Not connected</span>
    </div>
    <a href="https://vantage.invigilo.ai/settings" target="_blank">Get API key →</a>
  </div>

  <script src="popup.js"></script>
</body>
</html>
